# Pinned so the project name (and therefore the node_modules volume and
# container names) does not change if the directory is renamed or cloned.
name: taskflow

services:
  api:
    build: .
    image: taskflow-api-dev
    env_file:
      - .env
    # The local Prisma Postgres server binds to 127.0.0.1 on the host. Docker
    # Desktop runs containers inside a VM, so `network_mode: host` would mean
    # the VM, not this machine; host.docker.internal is what actually reaches
    # the host's loopback. Hence the separate *_CONTAINER connection strings.
    environment:
      DATABASE_URL: ${DATABASE_URL_CONTAINER}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL_CONTAINER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev
    stdin_open: true
    tty: true

  web:
    build: ./web
    image: taskflow-web-dev
    environment:
      # Container-to-container over the Compose network. Only the Next server
      # talks to the API; the browser only ever talks to Next.
      API_URL: http://api:4000/api
      NODE_ENV: development
      # Docker Desktop's filesystem does not deliver inotify events reliably,
      # so the dev server polls instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Host port is configurable because 3000 is often already taken.
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  node_modules:
  web_node_modules:
  web_next:
