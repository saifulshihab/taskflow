# Pinned so the project name (and therefore the node_modules volume and
# container names) does not change if the directory is renamed or cloned.
name: taskflow

services:
  api:
    build: .
    image: taskflow-api-dev
    env_file:
      - .env
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # The bind mount hides generated files from the image. Generate the Prisma
    # client in the mounted source tree before the API imports it.
    command: sh -c "npm run db:generate && exec npm run dev"
    stdin_open: true
    tty: true

  web:
    build: ./web
    image: taskflow-web-dev
    environment:
      # Browser on the host calls the published API port directly.
      NEXT_PUBLIC_API_URL: http://localhost:${PORT:-4000}/api
      NODE_ENV: development
      # Docker Desktop's filesystem does not deliver inotify events reliably,
      # so the dev server polls instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Host port is configurable because 3000 is often already taken.
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  node_modules:
  web_node_modules:
  web_next:
